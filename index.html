<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libraries.dev</title>
    <meta
      name="description"
      content="High-crafted UI libraries for AI agents: border-beam, thinking-orbs, bot-avatars, liquid-gooey, voice-glow, metal-fx, and img-fx."
    />
    <meta property="og:title" content="Libraries.dev" />
    <meta
      property="og:description"
      content="High-crafted UI libraries for AI agents: border-beam, thinking-orbs, bot-avatars, liquid-gooey, voice-glow, metal-fx, and img-fx."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#070707" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('libraries-theme');
          var theme = (t === 'light' || t === 'dark') ? t : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#f8f9fb] dark:bg-[#070707] text-zinc-900 dark:text-[#ededed] antialiased min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
